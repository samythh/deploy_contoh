<!DOCTYPE html>
<!--
  CARA LAMA — "div soup"

  Buka file ini dan semantic.html berdampingan di browser.
  TAMPILANNYA SAMA PERSIS. Itu inti demonstrasinya.

  Peserta perlu melihat sendiri bahwa div TIDAK salah dan TIDAK error —
  supaya argumen semantic tidak terdengar seperti aturan sewenang-wenang.
-->
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Div Soup — versi lama</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="header">
      <div class="logo">TokoKita</div>
      <div class="nav">
        <div class="nav-item">Beranda</div>
        <div class="nav-item">Produk</div>
        <div class="nav-item">Kontak</div>
      </div>
    </div>

    <div class="main">
      <div class="hero">
        <div class="hero-judul">Belanja Jadi Mudah</div>
        <div class="hero-teks">Ribuan produk pilihan, satu klik saja.</div>
      </div>

      <div class="daftar">
        <div class="kartu">
          <div class="kartu-judul">Laptop</div>
          <div class="kartu-harga">Rp 8.000.000</div>
        </div>
        <div class="kartu">
          <div class="kartu-judul">Mouse</div>
          <div class="kartu-harga">Rp 150.000</div>
        </div>
        <div class="kartu">
          <div class="kartu-judul">Keyboard</div>
          <div class="kartu-harga">Rp 300.000</div>
        </div>
      </div>
    </div>

    <div class="footer">© 2026 TokoKita</div>

    <!--
      PERTANYAAN UNTUK KELAS, tanyakan sebelum membuka semantic.html:

      "Coba lihat baris-baris </div> di atas. Tanpa scroll ke atas,
       ada yang bisa bilang </div> yang mana nutup navigasi?"

      Biarkan mereka mencoba sebentar. Kesulitan itu justru pesannya.
    -->
  </body>
</html>
