<!DOCTYPE html>
<!--
  BAGIAN 1 — Anatomi Dokumen HTML  (10–25 menit)

  Cara pakai di kelas: ketik ulang file ini dari nol bersama peserta.
  Jangan langsung ditunjukkan jadi — mengetik manual sekali adalah
  syarat sebelum Emmet diberikan sebagai hadiah di akhir bagian.
-->
<html lang="id">
  <!--
    lang="id" memberi tahu screen reader bahwa halaman ini berbahasa
    Indonesia. Tanpa ini, teks Indonesia dibaca dengan pelafalan Inggris.
  -->
  <head>
    <!--
      PERAGAAN CHARSET — lakukan ini di kelas:
      1. Hapus baris <meta charset> di bawah, simpan, refresh
      2. Lihat kata "Ekonomi — 2026" di body berubah jadi karakter aneh
      3. Kembalikan barisnya, refresh, normal lagi

      Tunjukkan, jangan cuma bilang. Peserta perlu melihat rusaknya.
    -->
    <meta charset="UTF-8" />

    <!--
      Tanpa baris ini, HP menampilkan versi desktop yang dikecilkan
      sampai tulisannya sebesar semut. Uji dengan Ctrl+Shift+M di DevTools.
      Ini baris yang membuat seluruh materi responsif nanti berfungsi.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Halaman Pertama Saya</title>
  </head>

  <body>
    <!--
      Semua yang KELIHATAN ada di sini.

      PERAGAAN <head> vs <body>: pindahkan <h1> di bawah ke dalam <head>,
      simpan, refresh.

      TULISANNYA TETAP MUNCUL. Jangan bilang ke kelas bahwa dia hilang —
      itu keliru, dan peserta yang iseng mencoba akan langsung tahu.

      Yang terjadi: parser tahu <h1> tidak sah di <head>, lalu diam-diam
      menutup <head>, membuka <body>, dan memindahkan <h1> ke sana.

      BUKA F12 -> tab Elements. Terlihat <h1> duduk di dalam <body>,
      padahal di file ditulis di <head>.

      ITU pelajarannya, dan lebih berharga daripada aturan head/body
      sendiri: yang kalian tulis di file BUKAN yang dibaca browser.
      HTML gagal tanpa suara. Makanya tab Elements adalah pengganti
      pesan error di HTML.

      Kalau tetap ingin menunjukkan "isi <head> tidak tampil di
      halaman", pakai <title> — teksnya cuma muncul di tab browser,
      dan <title> memang elemen <head> yang sah jadi tidak dipindahkan.
    -->
    <h1>Halo, saya peserta Metro Institute</h1>

    <p>Ekonomi Indonesia — 2026</p>

    <p>
      Ini paragraf biasa. Perhatikan indentasinya: tag yang ada di dalam
      tag lain selalu menjorok. Itu bukan soal kerapian — itu supaya
      struktur pohonnya kelihatan, dan tag yang lupa ditutup langsung
      ketahuan.
    </p>
  </body>
</html>
